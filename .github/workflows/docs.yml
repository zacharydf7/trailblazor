name: Docs

# Publishes the tip of main to GitHub Pages once its CI has passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CI can finish out of order and a queued run can replace another, so any run publishes the tip once its CI passed.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
      publish: ${{ steps.tip.outputs.publish }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          ci=$(gh run list --repo "$REPO" --workflow CI --commit "$tip" --event push \
            --json conclusion --jq '.[0].conclusion')
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
          echo "publish=$([ "$ci" = success ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0 # MinVer computes the version from tags and history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The navigation's upcoming components follow the issues as they are now, not as they were when roadmap.json
      # was last committed.
      - name: Refresh the roadmap
        env:
          GH_TOKEN: ${{ github.token }}
        run: docs/update-roadmap.sh

      - run: dotnet publish docs/Trailblazor.Docs --configuration Release --output publish

      # Search engines and coding assistants don't run the site's WebAssembly, so each page is also published as
      # Markdown, with llms.txt to list them.
      - name: Write the pages as Markdown
        run: dotnet run --project tools/Trailblazor.Docs.Markdown --configuration Release -- publish/wwwroot

      # The base follows Pages' settings: a custom domain serves the site at its root, and otherwise it's under the
      # repository's name. Pages answers a link to any page with 404.html.
      - name: Prepare the site for Pages
        working-directory: publish/wwwroot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          BASE=$(gh api "repos/$REPO/pages" --jq '.html_url | sub("^https?://[^/]+"; "")')
          case "$BASE" in /|/*/) ;; *) echo "::error::Unexpected Pages base: '$BASE'"; exit 1 ;; esac
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" index.html
          grep -q "<base href=\"$BASE\" />" index.html
          cp index.html 404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
