name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Pushes test in Chromium only; this run and a manual one cover every browser.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A newer push makes the run it replaces pointless, and only the tip of main is published.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Pinned, since the browsers' fonts and WebKit's build come from the release, and CONTRIBUTING says which to use
    # to run the tests as this job does.
    runs-on: ubuntu-24.04
    env:
      # The unit tests write their coverage of the library in this job only.
      TRAILBLAZOR_COVERAGE: true
      TRAILBLAZOR_BROWSERS: >-
        ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'chromium' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      # An empty list installs every browser.
      - run: >-
          pwsh tests/Trailblazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps
          $TRAILBLAZOR_BROWSERS
      # One test project at a time, so the browser tests don't slow the timing tests in the others past their limit.
      - id: tests
        run: dotnet test --configuration Release --no-build --max-parallel-test-modules 1
      # The unit tests' coverage of the library, published for reading, with no minimum to meet.
      - if: ${{ !cancelled() && steps.tests.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/coverage.cobertura.xml
          if-no-files-found: warn
      - if: ${{ !cancelled() && steps.tests.conclusion != 'skipped' }}
        shell: pwsh
        run: |
          $file = 'TestResults/coverage.cobertura.xml'
          if (Test-Path $file) {
            $coverage = ([xml](Get-Content $file)).coverage
            "Unit test coverage: {0:N1}% of lines, {1:N1}% of branches" -f (100 * [double]$coverage.'line-rate'),
              (100 * [double]$coverage.'branch-rate') >> $env:GITHUB_STEP_SUMMARY
          }
      # The suites for the components a dock panel often holds run again with each page inside a panel that shows in a
      # browser window of its own, where a script that asks the page's window for something gives itself away. Run
      # this way, the suites have no hang dump of their own, so the step has a time limit: 15 minutes for each browser
      # of the run. A failed test in the step before doesn't keep this one from running, so neither hides the other.
      - if: ${{ !cancelled() && steps.tests.conclusion != 'skipped' }}
        timeout-minutes: ${{ env.TRAILBLAZOR_BROWSERS == 'chromium' && 15 || 45 }}
        run: >-
          dotnet tests/Trailblazor.BrowserTests/bin/Release/net10.0/Trailblazor.BrowserTests.dll
          -class "*.TooltipTests" -class "*.PopoverTests" -class "*.MenuTests" -class "*.SelectTests"
          -class "*.TabsTests" -class "*.TabsOverflowTests" -class "*.ToolbarTests" -class "*.ContextMenuTests"
          -class "*.AccordionTests" -class "*.GridEditKeysTests" -class "*.TextFieldTests" -class "*.FieldBoxTests"
          -class "*.MentionInputTests" -class "*.RibbonKeyTipsTests" -class "*.TreeSelectTests"
          -class "*.ListBoxKeysTests" -class "*.NumberFieldTests" -class "*.AutocompleteTests"
          -class "*.TagInputTests" -class "*.GridBatchTests" -class "*.RichTextEditorTests"
          -class "*.ToastTests" -class "*.DialogTests" -class "*.DialogExtrasTests" -class "*.DialogLayerTests"
          -class "*.DialogMoveAndResizeTests" -class "*.DialogStateTests" -class "*.DialogWindowsTests"
          -class "*.DrawerTests" -class "*.PopconfirmTests" -class "*.HotkeysTests"
        env:
          TRAILBLAZOR_POPPED: 1
      # Once a week, and on a run started by hand, the browser tests run again in Chromium under the strict policy
      # from the docs' Content Security Policy guide, and a test fails on any violation the library's scripts cause.
      - if: >-
          ${{ !cancelled() && steps.tests.conclusion != 'skipped'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 60
        run: dotnet tests/Trailblazor.BrowserTests/bin/Release/net10.0/Trailblazor.BrowserTests.dll
        env:
          TRAILBLAZOR_BROWSERS: chromium
          TRAILBLAZOR_CSP: strict

  # TypeScript's checker reads the library's scripts, with the settings in jsconfig.json, and writes nothing. It's a job
  # of its own, so a type error doesn't keep the tests from running.
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: npx --yes --package typescript@7.0.2 tsc -p jsconfig.json

  # The testing packages promise the lowest versions in Directory.Packages.props, so the bUnit tests run against them.
  minimums:
    # Pinned, since the minimum Playwright installs its browsers' dependencies only on the Ubuntu releases it knew.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore -p:TestingMinimums=true
      - run: dotnet build --configuration Release --no-restore -p:TestingMinimums=true
      - run: dotnet test --configuration Release --no-build --project tests/Trailblazor.Tests
      # The browser tests need newer Playwright APIs, so a smoke project runs the helpers on the minimum version.
      - run: pwsh tests/Trailblazor.PlaywrightFloorTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --configuration Release --no-build --project tests/Trailblazor.PlaywrightFloorTests
