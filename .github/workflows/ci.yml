name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Pushes test in Chromium only; this run and a manual one cover every browser.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A newer push makes the run it replaces pointless, and only the tip of main is published.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TRAILBLAZOR_BROWSERS: >-
        ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'chromium' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      # An empty list installs every browser.
      - run: >-
          pwsh tests/Trailblazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps
          $TRAILBLAZOR_BROWSERS
      # One test project at a time, so the browser tests don't slow the timing tests in the others past their limit.
      - run: dotnet test --configuration Release --no-build --max-parallel-test-modules 1
