<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trailblazor</title>
    <base href="/" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/Trailblazor/trailblazor.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- What TbThemeHead renders in a server app: the remembered theme and palette go on before the first paint. -->
    <script src="_content/Trailblazor/theme-head.js" data-mode="system" data-palette="graphite"
        data-remember="true"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">🗙</button>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
