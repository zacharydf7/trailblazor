<!DOCTYPE html>
<html lang="en" data-tb-theme="system">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trailblazor</title>
    <base href="/" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Applies the remembered theme and palette before the first paint, so the page doesn't flash. -->
    <script>
        try {
            for (const name of ['tbTheme', 'tbPalette']) {
                const value = localStorage.getItem(`docs-${name}`);
                if (value) {
                    document.documentElement.dataset[name] = value;
                }
            }
        } catch {
        }
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">🗙</button>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
